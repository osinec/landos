<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Угадай где конфетка</title>
    <style>
        /* === НАСТРОЙКИ: размер картинки === */
        :root {
            --result-image-size: 300px; /* ← можно изменить размер */
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(145deg, #2b1e3a 0%, #1a1225 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 16px;
            overflow: hidden;
        }

        .game-card {
            background: rgba(255, 235, 200, 0.1);
            backdrop-filter: blur(4px);
            border-radius: 80px 80px 50px 50px;
            padding: 40px 30px 50px;
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.6), 0 0 0 2px #f7d9aa inset;
            max-width: 700px;
            width: 100%;
            transition: all 0.2s;
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            font-weight: 600;
            font-size: 2.4rem;
            letter-spacing: 2px;
            color: #ffe9c7;
            text-shadow: 0 4px 0 #7a4f2e, 0 8px 12px rgba(0, 0, 0, 0.5);
            margin-top: -8px;
            margin-bottom: 30px;
            word-break: break-word;
        }

        .fist-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px 10px;
            margin: 20px 0 30px;
        }

        .fist-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s ease;
            filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.5));
        }

        .fist-wrapper:hover {
            transform: scale(1.05);
        }

        .fist-wrapper:active {
            transform: scale(0.92);
        }

        .fist-emoji {
            font-size: 150px;
            line-height: 1;
            display: block;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: gentleSway 2.8s ease-in-out infinite alternate;
            text-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
        }

        .fist-wrapper:first-child .fist-emoji {
            animation-delay: 0s;
        }
        .fist-wrapper:last-child .fist-emoji {
            animation-delay: 0.9s;
        }

        @keyframes gentleSway {
            0% {
                transform: rotate(-4deg) translateY(0px);
            }
            100% {
                transform: rotate(6deg) translateY(-12px);
            }
        }

        .footer {
            color: #b69772;
            margin-top: 18px;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* ===== ПОЛНОЭКРАННОЕ ОКНО С РЕЗУЛЬТАТОМ ===== */
        .fullscreen-result {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            padding: 20px;
        }

        .fullscreen-result.show {
            opacity: 1;
            pointer-events: auto;
        }

        .fullscreen-result .result-image {
            width: var(--result-image-size);
            height: var(--result-image-size);
            object-fit: contain;
            animation: resultPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transform: scale(0);
            display: block;
            filter: drop-shadow(0 0 50px rgba(255, 215, 0, 0.6));
        }

        @keyframes resultPop {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .fullscreen-result .result-text {
            font-size: 4rem;
            font-weight: 800;
            margin-top: 30px;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
            animation: textFade 0.6s ease 0.2s both;
            color: #ffd700;
        }

        @keyframes textFade {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 500px) {
            .game-card {
                padding: 20px 16px 30px;
                border-radius: 50px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .fist-emoji {
                font-size: 110px;
            }
            .fullscreen-result .result-image {
                width: 180px;
                height: 180px;
            }
            .fullscreen-result .result-text {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

<!-- ===== ПОЛНОЭКРАННОЕ ОКНО ===== -->
<div class="fullscreen-result" id="fullscreenResult">
    <img class="result-image" id="resultImage" src="" alt="Результат">
    <div class="result-text" id="resultText">✅ Правильно! Вот она!</div>
</div>

<!-- ===== ОСНОВНАЯ ИГРА ===== -->
<div class="game-card">
    <h1>🍬 Угадай где конфетка</h1>

    <div class="fist-container">
        <div class="fist-wrapper" data-fist="left">
            <span class="fist-emoji" id="leftEmoji">👊</span>
        </div>
        <div class="fist-wrapper" data-fist="right">
            <span class="fist-emoji" id="rightEmoji">👊</span>
        </div>
    </div>

    <div class="footer">🍭 конфетка спрятана за одним из кулачков</div>
</div>

<script>
    (function() {
        // =============================================
        // ====== ВСТАВЬТЕ НАЗВАНИЕ ВАШЕЙ КАРТИНКИ ======
        // =============================================
        const CUSTOM_IMAGE_NAME = 'палец.png'; // ← сюда имя вашего файла
        // =============================================

        const leftWrapper = document.querySelector('[data-fist="left"]');
        const rightWrapper = document.querySelector('[data-fist="right"]');

        const fullscreen = document.getElementById('fullscreenResult');
        const resultImage = document.getElementById('resultImage');
        const resultText = document.getElementById('resultText');

        let gameActive = true;
        let resetTimeout = null;

        function resetGame() {
            if (resetTimeout) {
                clearTimeout(resetTimeout);
                resetTimeout = null;
            }

            gameActive = true;
            fullscreen.classList.remove('show');
        }

        function showFullscreen() {
            // Показываем ТОЛЬКО вашу картинку
            resultImage.src = CUSTOM_IMAGE_NAME;
            
            // Перезапускаем анимацию картинки
            resultImage.classList.remove('result-image');
            void resultImage.offsetWidth;
            resultImage.classList.add('result-image');
            resultImage.style.display = 'block';

            resultText.textContent = '✅ Правильно! Вот она!';
            fullscreen.className = 'fullscreen-result show';
        }

        function handleFistClick(event) {
            if (!gameActive) return;

            // Блокируем игру
            gameActive = false;

            // Показываем полноэкранное окно с вашей картинкой
            showFullscreen();

            // Автоматический перезапуск через 2.8 секунды
            if (resetTimeout) {
                clearTimeout(resetTimeout);
            }
            resetTimeout = setTimeout(() => {
                resetGame();
                resetTimeout = null;
            }, 2800);
        }

        // === Обработчики ===
        leftWrapper.addEventListener('click', handleFistClick);
        rightWrapper.addEventListener('click', handleFistClick);

        // Клик по экрану — перезапуск
        fullscreen.addEventListener('click', function() {
            if (resetTimeout) {
                clearTimeout(resetTimeout);
                resetTimeout = null;
            }
            resetGame();
        });

        resetGame();
    })();
</script>

</body>
</html>
